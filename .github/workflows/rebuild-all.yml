name: Rebuild all books

# Fires a repository_dispatch at every book repo so a design change here
# redeploys all of them without touching each repo by hand.
#
# Requires a repository secret BOOKS_DISPATCH_TOKEN: a fine-grained PAT scoped
# to every repo in the matrix below with "Contents: read and write"
# permission. Adding a repo here means adding it to the PAT as well, or its
# dispatch fails with 404.

on:
  push:
    branches: [main]
    paths:
      - "_extensions/**"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - or-book
          - rl-book
          - data-science-book
          - computer-literacy-book
          - database-book
          # Not a course book, but it has a publish workflow, so a design
          # change should redeploy it too. math-note is left out on purpose:
          # it has no workflow to dispatch to.
          - jb-open-campus
    steps:
      - name: Trigger ${{ matrix.repo }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${{ secrets.BOOKS_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository_owner }}/${{ matrix.repo }}/dispatches" \
            -d '{"event_type":"theme-updated"}'
